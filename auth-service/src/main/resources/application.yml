spring:
  application:
    name: auth-service
  config:
    import: optional:configserver:http://localhost:8889
  cloud:
    config:
      retry:
        initial-interval: 3000
        multiplier: 1.5
        max-attempts: 5
  datasource:
    url: jdbc:mysql://localhost:3306/auth_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: system
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

jwt:
  secret: SmartCourierSecretKeyForJWTTokenGenerationAndValidation2024SecureKey
  expiration: 86400000

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
