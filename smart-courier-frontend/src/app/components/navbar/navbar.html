<nav class="navbar-shell">
  <div class="container navbar-container">
    <a routerLink="/" class="navbar-logo">
      <i class="bi bi-box-seam-fill"></i>
      <span>SmartCourier</span>
    </a>

    <!-- Public Navigation -->
    <div class="navbar-links" *ngIf="!isLoggedIn()">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Home</a>
      <a href="#">About Us</a>
      <a href="#">Help</a>
      <div class="auth-buttons">
        <a routerLink="/login" class="btn btn-outline btn-sm">Login</a>
        <a routerLink="/signup" class="btn btn-primary btn-sm">Sign Up</a>
      </div>
    </div>

    <!-- Customer Navigation -->
    <div class="navbar-links" *ngIf="isLoggedIn() && !isAdmin()">
      <a routerLink="/customer" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Dashboard</a>
      <a routerLink="/customer/deliveries" routerLinkActive="active">My Deliveries</a>
      <a routerLink="/track" routerLinkActive="active">Track Parcel</a>
      <a href="#">Help</a>
    </div>

    <!-- Admin Topbar Info (Simplified if sidebar is present) -->
    <div class="navbar-links" *ngIf="isLoggedIn() && isAdmin()">
      <span class="admin-badge">ADMIN PORTAL</span>
    </div>

    <!-- User Profile Dropdown -->
    <div class="user-actions" *ngIf="isLoggedIn()">
      <div class="profile-dropdown-wrapper" (click)="toggleProfileMenu()">
        <div class="user-avatar">{{ getUser()?.username?.charAt(0) }}</div>
        <i class="bi bi-chevron-down"></i>
        
        <div class="profile-menu glass-card" *ngIf="showProfileMenu">
          <div class="menu-header">
            <p class="font-bold">{{ getUser()?.username }}</p>
            <p class="small-text text-muted">{{ getUser()?.email }}</p>
          </div>
          <hr>
          <a routerLink="/profile" (click)="$event.stopPropagation(); showProfileMenu = false">
            <i class="bi bi-person"></i> View Profile
          </a>
          <a routerLink="/profile" (click)="$event.stopPropagation(); showProfileMenu = false">
            <i class="bi bi-pencil"></i> Edit Profile
          </a>
          <hr>
          <button class="logout-link" (click)="logout()">
            <i class="bi bi-box-arrow-left"></i> Logout
          </button>
        </div>
      </div>
    </div>
  </div>
</nav>
