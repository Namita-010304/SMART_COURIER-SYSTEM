<div class="auth-container">
  <div class="glass-card auth-card">
    <div class="auth-header">
      <div class="logo-circle"><i class="bi bi-box-seam"></i></div>
      <h2>Welcome Back</h2>
      <p>Log in to manage your deliveries</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="auth-form">
      <div class="form-group">
        <label>Username</label>
        <div class="input-wrapper">
          <i class="bi bi-person"></i>
          <input type="text" formControlName="username" placeholder="Enter your username">
        </div>
        <div class="error-msg" *ngIf="loginForm.get('username')?.touched && loginForm.get('username')?.invalid">
          <span *ngIf="loginForm.get('username')?.errors?.['required']">Username is required</span>
          <span *ngIf="loginForm.get('username')?.errors?.['minlength']">Min 4 characters required</span>
        </div>
      </div>

      <div class="form-group">
        <label>Password</label>
        <div class="input-wrapper">
          <i class="bi bi-lock"></i>
          <input [type]="showPassword ? 'text' : 'password'" formControlName="password" placeholder="••••••••">
          <i class="bi eye-icon" [ngClass]="showPassword ? 'bi-eye-slash' : 'bi-eye'" (click)="togglePassword()"></i>
        </div>
        <div class="error-msg" *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid">
          <span *ngIf="loginForm.get('password')?.errors?.['required']">Password is required</span>
          <span *ngIf="loginForm.get('password')?.errors?.['minlength']">Min 6 characters required</span>
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-full" [disabled]="loginForm.invalid && loginForm.touched">
        Sign In <i class="bi bi-arrow-right-short"></i>
      </button>
      
      <p class="auth-switch">
        Don't have an account? <a routerLink="/signup">Create one</a>
      </p>
    </form>
  </div>
</div>
